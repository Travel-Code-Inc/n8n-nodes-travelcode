# Publishes to npm when a GitHub release is published (or by hand).
#
# Auth is npm Trusted Publishing (OIDC): no token is stored in this repository.
# One-time setup on npmjs.com → n8n-nodes-travelcode → Settings → Trusted Publisher:
#   GitHub Actions, owner Travel-Code-Inc, repository n8n-nodes-travelcode, workflow publish.yml.
# The trusted publisher is allowed `npm stage publish` only: the workflow stages the version and a
# maintainer approves it with 2FA (npmjs.com → package → Staged versions, or `npm stage approve <id>`).
# Trusted Publishing and staging need a recent npm, hence the npm upgrade step.

name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm stage publish --access public --provenance --ignore-scripts
